[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-data-extractor"
version = "0.1.0"
description = "Config-driven, robots.txt-respecting web data extraction with an audited CSV/XLSX export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chase Builds" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-openpyxl",
]

[project.scripts]
wde = "web_data_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# pyarrow ships no type information; it is an optional extra used in one function.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["web_data_extractor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
