# books.toscrape.com is a sandbox built for scraping practice.
# Small caps on purpose: one list page, its 20 detail pages.
name: books-toscrape

start_urls:
  - https://books.toscrape.com/catalogue/page-1.html

politeness:
  min_delay_seconds: 1.0

cache:
  dir: .wde-cache
  ttl_hours: 24

limits:
  max_pages: 1
  max_detail_pages: 20
  max_requests: 40

list:
  item_selector: "article.product_pod"
  fields:
    title:
      selector: "h3 a"
      attr: title
      required: true
    price_gbp:
      selector: ".price_color"
      type: number
      min: 0.01
      required: true
    rating:
      selector: "p.star-rating"
      attr: class
      regex: 'star-rating (\w+)'
      map: {One: 1, Two: 2, Three: 3, Four: 4, Five: 5}
      required: true
    link:
      selector: "h3 a"
      attr: href
      type: url

pagination:
  next_selector: "li.next a"

detail:
  url_field: link
  fields:
    upc:
      selector: "table.table tr:nth-of-type(1) td"
      required: true
    category: "ul.breadcrumb li:nth-of-type(3) a"
    stock:
      selector: ".product_main .instock.availability"
      regex: '(\d+) available'
      type: integer

unique_by: [upc]
